  }

  location ^~ /admin/ {
    expires -1;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location / {
    return 404;
  }

  location = /index.html {
    expires -1;
    add_header Cache-Control "no-cache";
  }

  location ^~ /assets/ {
    expires -1;
    add_header Cache-Control "no-cache";
  }

  location ~* \.(png|jpg|jpeg|gif|svg|ico|woff|woff2|webp)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
