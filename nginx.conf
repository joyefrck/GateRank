    proxy_set_header X-Forwarded-Host $host;
  }

  location ^~ /download/file/ {
    limit_req zone=tool_download_req burst=20 nodelay;
    limit_conn tool_download_conn 2;
    limit_conn tool_download_global 50;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://gaterank-api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location = /tools/download {
    proxy_pass http://gaterank-api:8787/tools/download;
