  location = /portal {
    expires -1;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location = /portal/ {
    expires -1;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location = /admin {
    expires -1;
