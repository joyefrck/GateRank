  }

  location ^~ /uploads/tools/files/ {
    return 403;
  }

  location ^~ /_protected_uploads/tools/files/ {
    internal;
    proxy_pass http://gaterank-api:8787/uploads/tools/files/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    limit_rate_after 10m;
    limit_rate 2m;
